name: iOS TestFlight Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Domyślne uprawnienia dla całego pliku. Job niżej ma własne, ale bez tego
# bloku każdy DOPISANY job startowałby z pełnym zapisem do repozytorium.
permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PROJECT_PATH: Scoffie.xcodeproj
      SCHEME: Scoffie
      BUNDLE_ID: app.scoffie.ios
      TEAM_ID: 5R874L3LNP
      ARCHIVE_PATH: ${{ github.workspace }}/build/scoffie.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Domyślnie checkout zostawia GITHUB_TOKEN w `.git/config` na cały
          # bieg. Nic go tu nie potrzebuje po pobraniu kodu.
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          # Prefer Xcode 26.x for iOS 26 SDK (required for Liquid Glass tab bar)
          xcode26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode26" ]; then
            echo "Using $xcode26"
            sudo xcode-select -s "$xcode26/Contents/Developer"
          else
            echo "Xcode 26 not found, using default: $(xcode-select -p)"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH"

      - name: Decode App Store Connect key
        id: appstore-key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          key_dir="$RUNNER_TEMP/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | openssl base64 -d -A > "$key_path"
          echo "dir=$key_dir" >> "$GITHUB_OUTPUT"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Import code-signing certificates
        # Przypięte do commita, nie do taga. Ta akcja dostaje certyfikat
        # dystrybucyjny, hasło do `.p12` i hasło keychaina — przestawiony tag
        # oddaje komplet do podpisywania aplikacji naszym nazwiskiem.
        # SHA = tag v5.0.3 (sprawdzone 13.09.2026). Dependabot ma otwarty PR
        # na 7.0.0; podniesienie wymaga przejrzenia zmian w akcji, nie samego
        # przyjęcia PR-a — i buildu, którego dziś nie ma jak uruchomić.
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Archive release build
        env:
          ASC_KEY_PATH: ${{ steps.appstore-key.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            clean archive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      # `xcodebuild` zaczyna log blokiem „Command line invocation:", czyli
      # pełną linią poleceń — z identyfikatorem klucza i wydawcy App Store
      # Connect. GitHub maskuje sekrety w logu KONSOLI, ale NIE w plikach
      # artefaktów, a `archive-log` (7 dni) pobierze każdy z odczytem repo.
      # To nie klucz prywatny, tylko identyfikatory — ale trzymamy je jako
      # sekrety i razem z wyciekiem `.p8` dają pełny dostęp do App Store
      # Connect API. (Audyt 12.09.2026, P1.13.)
      #
      # `sed -i ''` z pustym argumentem: runner jest macOS, więc BSD sed.
      - name: Wytrzyj sekrety z logu builda
        if: always()
        run: |
          LOG="$RUNNER_TEMP/archive.log"
          [ -f "$LOG" ] || exit 0
          sed -i '' -E \
            's/(-authenticationKey(ID|IssuerID)|--apiKey|--apiIssuer)([[:space:]]+|=)[^[:space:]]+/\1\3***/g' \
            "$LOG"

      - name: Błędy kompilatora
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/archive.log"
          [ -f "$LOG" ] || exit 0
          echo "::group::Błędy kompilatora"
          ERRORS=$(grep -nE "error:|fatal error:|Command .* failed" "$LOG" | head -50 || true)
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
          else
            echo "Brak linii z 'error:' — problem jest poza kompilacją."
          fi
          echo "::endgroup::"
          echo "::group::Ostatnie 80 linii logu"
          tail -80 "$LOG"
          echo "::endgroup::"

      - name: Pełny log builda
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: archive-log
          path: ${{ runner.temp }}/archive.log
          retention-days: 7

      - name: Export IPA
        env:
          ASC_KEY_PATH: ${{ steps.appstore-key.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Locate exported IPA
        id: exported-ipa
        run: |
          ipa_path="$(find "$EXPORT_PATH" -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$ipa_path" ]; then
            echo "No exported .ipa found in $EXPORT_PATH" >&2
            exit 1
          fi
          echo "path=$ipa_path" >> "$GITHUB_OUTPUT"

      # Podpisany IPA jest dostępny dla każdego z odczytem repo — tydzień
      # wystarczy na diagnozę nieudanego uploadu, potem artefakt znika.
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: scoffie-testflight-ipa
          path: ${{ steps.exported-ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build to TestFlight
        env:
          API_PRIVATE_KEYS_DIR: ${{ steps.appstore-key.outputs.dir }}
          IPA_PATH: ${{ steps.exported-ipa.outputs.path }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool \
            --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --output-format json

name: iOS CI

# Tylko skaner sekretów (Linux). Build, podpis i TestFlight robi Xcode Cloud
# (25 h/mies. w ramach Apple Developer Program) — od 23.09.2026 joby macOS
# zniknęły stąd, bo minuta macOS liczy się w Actions dziesięciokrotnie
# i wyczerpywała limit konta. Symbole do Sentry: `ci_scripts/`.

on:
  pull_request:
  # Tylko `main`. Wcześniej był tu też `develop`, przez co KAŻDY pull request
  # z develop budował się dwa razy: raz ze zdarzenia push, raz z pull_request.
  # Runnery macOS liczą się dziesięciokrotnie drożej od linuksowych, więc było
  # to najdroższe miejsce w całym repozytorium i nic nie wnosiło.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Codex czyta `AGENTS.md`, Claude Code — `CLAUDE.md`: ta sama treść
  # (1.10.2026). Sekunda na Linuksie.
  agents-md:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instrukcje agentów zgodne (CLAUDE.md = AGENTS.md)
        run: cmp -s CLAUDE.md AGENTS.md || { echo "AGENTS.md różni się od CLAUDE.md — zrób cp CLAUDE.md AGENTS.md"; exit 1; }

  # Skaner sekretów (klucze API, tokeny, hasła) w zmianach — zamiennik płatnej
  # ochrony GitHuba dla prywatnych repozytoriów. Czerwony = merge stoi.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Przy pull requeście akcja czyta listę commitów PR-a przez API —
      # bez tego uprawnienia kończy się 403 „Resource not accessible".
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Przypięte do commita, nie do ruchomego taga: akcja dostaje
      # GITHUB_TOKEN, a tag można przestawić na dowolny kod w dowolnej chwili.
      # SHA = tag v3.0.0 (sprawdzone `git ls-remote` 7.10.2026). To samo
      # dotyczy `actions/checkout` wyżej (v7.0.1); Dependabot podbija SHA.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

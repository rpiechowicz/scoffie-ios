name: iOS CI

# Tylko skaner sekretów (Linux). Build, podpis i TestFlight robi Xcode Cloud
# (25 h/mies. w ramach Apple Developer Program) — od 23.09.2026 joby macOS
# zniknęły stąd, bo minuta macOS liczy się w Actions dziesięciokrotnie
# i wyczerpywała limit konta. Symbole do Sentry: `ci_scripts/`.

on:
  pull_request:
  # Tylko `main`. Wcześniej był tu też `develop`, przez co KAŻDY pull request
  # z develop budował się dwa razy: raz ze zdarzenia push, raz z pull_request.
  # Runnery macOS liczą się dziesięciokrotnie drożej od linuksowych, więc było
  # to najdroższe miejsce w całym repozytorium i nic nie wnosiło.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skaner sekretów (klucze API, tokeny, hasła) w zmianach — zamiennik płatnej
  # ochrony GitHuba dla prywatnych repozytoriów. Czerwony = merge stoi.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Przy pull requeście akcja czyta listę commitów PR-a przez API —
      # bez tego uprawnienia kończy się 403 „Resource not accessible".
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Przypięte do commita, nie do ruchomego taga `v2`: akcja dostaje
      # GITHUB_TOKEN, a tag można przestawić na dowolny kod w dowolnej chwili.
      # SHA = tag v2 (sprawdzone 13.09.2026).
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

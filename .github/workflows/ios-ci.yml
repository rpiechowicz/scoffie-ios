name: iOS CI

on:
  pull_request:
  # Tylko `main`. Wcześniej był tu też `develop`, przez co KAŻDY pull request
  # z develop budował się dwa razy: raz ze zdarzenia push, raz z pull_request.
  # Runnery macOS liczą się dziesięciokrotnie drożej od linuksowych, więc było
  # to najdroższe miejsce w całym repozytorium i nic nie wnosiło.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Skaner sekretów (klucze API, tokeny, hasła) w zmianach — zamiennik płatnej
  # ochrony GitHuba dla prywatnych repozytoriów. Czerwony = merge stoi.
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Przy pull requeście akcja czyta listę commitów PR-a przez API —
      # bez tego uprawnienia kończy się 403 „Resource not accessible".
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: macos-latest
    timeout-minutes: 30
    # Token joba tylko do odczytu — build nie ma po co pisać do repo, a bez
    # tego bloku job dziedziczy domyślne uprawnienia repozytorium.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26
        run: |
          # Keep CI aligned with the project's iOS 26 deployment target.
          xcode26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode26" ]; then
            echo "Using $xcode26"
            sudo xcode-select -s "$xcode26/Contents/Developer"
          else
            echo "Xcode 26 not found, using default: $(xcode-select -p)"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep iphonesimulator

      # Runner macOS liczy się DZIESIĘCIOKROTNIE. Pobieranie zależności SPM od
      # zera przy każdym biegu to około minuty realnego czasu, czyli dziesięć
      # minut z rachunku — przy dwóch tysiącach minut miesięcznie w planie
      # darmowym to nie jest drobiazg. Klucz na `Package.resolved`, więc cache
      # unieważnia się dokładnie wtedy, gdy zmienia się wersja zależności.
      - name: Cache zależności SPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "Scoffie.xcodeproj"

      - name: Build app
        run: |
          set -o pipefail
          # Avoid universal simulator binaries on arm64 runners.
          # Xcode 26.3 on GitHub Actions fails while lipo-ing preview dylibs for x86_64 + arm64.
          xcodebuild \
            -project "Scoffie.xcodeproj" \
            -scheme "Scoffie" \
            -destination "generic/platform=iOS Simulator" \
            -sdk iphonesimulator \
            build \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            EXCLUDED_ARCHS=x86_64 \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Błędy kompilatora
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          echo "::group::Błędy kompilatora"
          ERRORS=$(grep -nE "error:|fatal error:|Command .* failed" "$LOG" | head -50 || true)
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
          else
            echo "Brak linii z 'error:' — problem jest poza kompilacją."
          fi
          echo "::endgroup::"
          echo "::group::Ostatnie 80 linii logu"
          tail -80 "$LOG"
          echo "::endgroup::"

      - name: Pełny log builda
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 7
